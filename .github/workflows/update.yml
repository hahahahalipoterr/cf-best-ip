name: Update Cloudflare Best IPs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Download CloudflareST
      run: |
        wget https://github.com/XIU2/CloudflareSpeedTest/releases/download/v2.3.4/cfst_linux_amd64.tar.gz
        tar -xzf cfst_linux_amd64.tar.gz
        chmod +x CloudflareST

    - name: Run Speed Test
      run: |
        mkdir -p data
        ./CloudflareST \
          -httping \
          -dn 300 \
          -sl 5 \
          -tl 160 \
          -url https://cf.xiu2.xyz \
          -o data/result.csv

    - name: Generate region Top100 lists
      run: |
        tail -n +2 data/result.csv | awk -F, '$5=="HK"{print $1":"$2" "$3"ms"}' | head -n 100 > data/HK.txt
        tail -n +2 data/result.csv | awk -F, '$5=="SG"{print $1":"$2" "$3"ms"}' | head -n 100 > data/SG.txt
        tail -n +2 data/result.csv | awk -F, '$5=="JP"{print $1":"$2" "$3"ms"}' | head -n 100 > data/JP.txt
        tail -n +2 data/result.csv | awk -F, '$5=="US"{print $1":"$2" "$3"ms"}' | head -n 100 > data/US.txt

    - name: Commit changes
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add data/*
        git commit -m "Daily update $(date +%F)" || echo "No changes"

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
